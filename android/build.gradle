buildscript {
    // Kotlin version used to compile this library.
    //
    // IMPORTANT: this must stay in the same minor line as the Kotlin compiler that
    // ends up compiling these sources, and it must never be NEWER than the one the
    // consuming application uses. AGP 9.x bundles a Kotlin Gradle Plugin, and the
    // root project's buildscript classpath takes precedence over this one, so a
    // newer version declared here is silently ignored and only the artifacts below
    // leak into the application with a too-new Kotlin metadata version.
    // See https://github.com/capacitor-community/local-network/issues/3
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}

plugins {
    id "org.jlleitschuh.gradle.ktlint" version "14.2.0" apply false
}

ext {
    junitVersion = project.hasProperty('junitVersion') ? project.property('junitVersion') : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? project.property('androidxAppCompatVersion') : '1.8.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? project.property('androidxJunitVersion') : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? project.property('androidxEspressoCoreVersion') : '3.7.0'
}

apply plugin: 'com.android.library'
// AGP 9 ships its own built-in Kotlin support, which already registers the
// `kotlin` extension. Applying the Kotlin Android plugin on top of it is an
// error, so only apply it when nothing else did.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}
apply plugin: 'org.jlleitschuh.gradle.ktlint'
// Generates the kotlinx.serialization serializers for the @Serializable result
// models. Required for toJSObject() to work at runtime.
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

import groovy.json.JsonSlurper

def getPluginVersion() {
    try {
        def packageJsonFile = file('../package.json')
        if (packageJsonFile.exists()) {
            def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
            if (packageJson.version) {
                return packageJson.version
            }
        }
    } catch (Exception e) {
        throw new GradleException("Failed to read plugin version from package.json", e)
    }

    throw new GradleException("Plugin version not found in ../package.json")
}

def pluginVersion = getPluginVersion()

android {
    namespace = "com.capacitorjs.community.plugins.localnetwork"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    // AGP 8.0+ disables BuildConfig by default for libraries.
    // We need to enable it to inject the plugin version.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1

        // Dynamic versioning (feature enabled)
        versionName = pluginVersion

        // Injects the version into the BuildConfig class ONLY if feature is enabled
        buildConfigField "String", "PLUGIN_VERSION", "\"${pluginVersion}\""

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // kotlin-stdlib is intentionally NOT declared with an explicit version.
    // The active Kotlin toolchain (the Kotlin Gradle Plugin, or AGP 9's built-in
    // Kotlin) injects the stdlib matching the compiler it actually uses. Pinning it
    // here is what broke applications whose Kotlin compiler was older than this
    // library's, with "Class 'kotlin.Unit' was compiled with an incompatible
    // version of Kotlin". See issue #3.
    //
    // kotlinx-serialization carries Kotlin metadata of the version it was built
    // with: 1.9.x ships Kotlin 2.1 metadata, readable by every Kotlin compiler
    // from 2.0 onwards. Do not bump it without checking the metadata version it
    // was built against.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}