name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Plugin
        run: pnpm run verify

  example-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Plugin Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Example App Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: example-app

      - name: Build Example App
        run: pnpm run build
        working-directory: example-app

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: example-app

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > example-app/android/local.properties

      # Compiling the plugin module from a real application project is the
      # regression test for the Kotlin version conflict reported in issue #3:
      # the plugin must compile against whatever Kotlin toolchain the
      # application provides.
      - name: Compile Plugin Module
        run: ./gradlew :capacitor-community-local-network:compileDebugKotlin
        working-directory: example-app/android
